merge_queue:
  skip_intermediate_results: true
queue_rules:
  - name: "default"
    merge_method: "squash"
    batch_size:
      min: 1
      max: 10
    batch_max_wait_time: "5 min"
    max_checks_retries: 3
    merge_conditions:
      - "-draft"
      - "check-success = summary / Check Results"
pull_request_rules:
  - name: "cleanup labels on close"
    conditions:
      - "closed"
      - "-merged"
    actions:
      label:
        remove:
          - "agent/triage"
          - "agent/fixing"
          - "agent/fixable"
          - "agent/needs-review"
merge_protections:
  - name: "approval"
    if:
      - "base = main"
    success_conditions:
      - "#approved-reviews-by >= 1"
  - name: "outsider"
    if:
      - "base = main"
      - "-author = anthony-spruyt"
      - "-author = spruyt-labs-bot"
      - "-author = skynet-rw[bot]"
      - "-author = skynet-r[bot]"
      - "-author = renovate[bot]"
      - "-author = repo-operator-release-bot[bot]"
      - "-author = repo-operator[bot]"
    success_conditions:
      - "approved-reviews-by = anthony-spruyt"
  - name: "gate-files"
    if:
      - "base = main"
      - "files~=^(\\.github/|\\.mergify\\.yml$|renovate\\.json$|renovate-overrides\\.json5$)"
    success_conditions:
      - or:
          - "approved-reviews-by = anthony-spruyt"
          - and:
              - "author = renovate[bot]"
              - "-commits[*].author~=^(?!renovate\\[bot\\]$)"
              - "-commits[*].email_author~=^(?!29139614\\+renovate\\[bot\\]@users\\.noreply\\.github\\.com$)"
              - "-commits[*].email_committer~=^(?!noreply@github\\.com$)"
              - "#commits-unverified = 0"
          - and:
              - "author = anthony-spruyt"
              - "-commits[*].email_author~=^(?!(aspruyt@hotmail\\.co\\.uk|99536297\\+anthony-spruyt@users\\.noreply\\.github\\.com)$)"
              - "-commits[*].email_committer~=^(?!(aspruyt@hotmail\\.co\\.uk|99536297\\+anthony-spruyt@users\\.noreply\\.github\\.com|noreply@github\\.com)$)"
              - "#commits-unverified = 0"
merge_protections_settings:
  reporting_method: "check-runs"
  auto_merge_conditions:
    - "-label = blocked"
