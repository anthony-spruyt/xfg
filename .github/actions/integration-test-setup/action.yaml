---
name: Integration Test Setup
description: Common setup steps for integration test jobs

inputs:
  download-package:
    description: "Download the package artifact and set XFG_PACKAGE env var"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: "24"
        cache: "npm"
        cache-dependency-path: packages/xfg/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: packages/xfg
      run: npm ci

    - name: Download build artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: dist
        path: packages/xfg/dist/

    - name: Download package artifact
      if: inputs.download-package == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: package

    - name: Set package path
      if: inputs.download-package == 'true'
      shell: bash
      run: echo "XFG_PACKAGE=$(ls aspruyt-xfg-*.tgz)" >> "$GITHUB_ENV"
