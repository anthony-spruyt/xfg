# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json

name: "Cleanup Stale Test Repos"
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "List repos without deleting them"
        type: boolean
        default: true
permissions:
  contents: "read"
jobs:
  cleanup-org:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: integration-main
      deployment: false
    steps:
      - name: Harden Runner
        uses: anthony-spruyt/repo-operator/.github/actions/harden-runner@cfd9cfe37fdad0834151b9187a9cd7e8fcfb8e20 # main
        with:
          allowed-endpoints: >-
            api.github.com:443
            cafe.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check environment secrets
        env:
          GH_PAT_ORG: ${{ secrets.GH_PAT_ORG }}
        run: .github/scripts/require-env-secrets.sh integration-main GH_PAT_ORG

      - name: Delete stale test repos in spruyt-labs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
        run: ./.github/scripts/cleanup-stale-test-repos.sh spruyt-labs 6 "${DRY_RUN}"

  cleanup-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: integration-main
      deployment: false
    steps:
      - name: Harden Runner
        uses: anthony-spruyt/repo-operator/.github/actions/harden-runner@cfd9cfe37fdad0834151b9187a9cd7e8fcfb8e20 # main
        with:
          allowed-endpoints: >-
            api.github.com:443
            cafe.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check environment secrets
        env:
          GH_PAT_BOT: ${{ secrets.GH_PAT_BOT }}
        run: .github/scripts/require-env-secrets.sh integration-main GH_PAT_BOT

      - name: Delete stale test repos in spruyt-labs-bot
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_BOT }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
        run: ./.github/scripts/cleanup-stale-test-repos.sh spruyt-labs-bot 6 "${DRY_RUN}"
