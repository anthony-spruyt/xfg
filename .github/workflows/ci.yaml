---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: CI

on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
  # workflow_dispatch:  # Uncomment to enable manual runs

permissions:
  actions: write
  contents: write
  pull-requests: "write"
  statuses: "write"
  security-events: "write"

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      build-needed: ${{ steps.filter.outputs.build-needed }}
      integration-needed: ${{ steps.filter.outputs.integration-needed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Check for integration-relevant changes
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "origin/${BASE_REF}..${COMMIT_SHA}")
          else
            CHANGED=$(git diff --name-only HEAD~1)
          fi

          if echo "$CHANGED" | grep -qE '^(src/|test/|scripts/|package\.json$|package-lock\.json$)'; then
            echo "build-needed=true" >> "$GITHUB_OUTPUT"
            echo "Code changes detected"
          else
            echo "build-needed=false" >> "$GITHUB_OUTPUT"
            echo "No code changes, will skip build and integration tests"
          fi

          # Integration tests only needed for source/test/script changes,
          # not version-only bumps (package.json + package-lock.json)
          if echo "$CHANGED" | grep -qE '^(src/|test/|scripts/)'; then
            echo "integration-needed=true" >> "$GITHUB_OUTPUT"
            echo "Source changes detected — integration tests needed"
          else
            echo "integration-needed=false" >> "$GITHUB_OUTPUT"
            echo "No source changes — skipping integration tests"
          fi

          echo "Changed files:"
          echo "$CHANGED"

  lint:
    if: github.event_name == 'pull_request'
    uses: "anthony-spruyt/repo-operator/.github/workflows/_lint.yaml@main"
    secrets: "inherit"

  build:
    needs:
      - "lint"
      - "check-changes"
    if: ${{ !failure() && !cancelled() && needs.check-changes.outputs.build-needed == 'true' }}
    runs-on: ubuntu-latest

    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@1af58845a975a7985b0beb0cbe6fbbb71a41dbad # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true

      - name: Upload build artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: dist
          path: dist/
          retention-days: 1

      - name: Create package for action tests
        run: npm pack

      - name: Upload package artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: package
          path: "*.tgz"
          retention-days: 1

  integration-tests:
    needs:
      - "build"
      - "check-changes"
    if: ${{ !failure() && !cancelled() && needs.check-changes.outputs.integration-needed == 'true' && github.event_name == 'push' }}
    uses: ./.github/workflows/_integration-tests.yaml
    secrets: "inherit"

  # Summary job for branch protection - references reusable workflow job
  summary:
    needs:
      - "check-changes"
      - "lint"
      - "build"
      - "integration-tests"
    if: "always()"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_summary.yaml@main"
