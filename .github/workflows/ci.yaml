---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: CI

on:
  pull_request:
    branches:
      - "main"
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - "main"
  # workflow_dispatch:  # Uncomment to enable manual runs

permissions:
  actions: write
  contents: write
  pull-requests: "write"
  statuses: "write"
  security-events: "write"

jobs:
  check-changes:
    if: github.event.action != 'labeled' || github.event.label.name == 'run-integration'
    runs-on: ubuntu-latest
    outputs:
      build-needed: ${{ steps.filter.outputs.build-needed }}
      integration-needed: ${{ steps.filter.outputs.integration-needed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Check for integration-relevant changes
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'run-integration') }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "origin/${BASE_REF}..${COMMIT_SHA}")
          else
            CHANGED=$(git diff --name-only HEAD~1)
          fi

          if echo "$CHANGED" | grep -qE '^(src/|test/|scripts/|package\.json$|package-lock\.json$)'; then
            echo "build-needed=true" >> "$GITHUB_OUTPUT"
            echo "Code changes detected"
          else
            echo "build-needed=false" >> "$GITHUB_OUTPUT"
            echo "No code changes, will skip build and integration tests"
          fi

          # Integration tests: always on push to main (source changes),
          # on PRs only with 'run-integration' label or integration test changes
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$HAS_LABEL" = "true" ]; then
              echo "integration-needed=true" >> "$GITHUB_OUTPUT"
              echo "PR has 'run-integration' label — integration tests enabled"
            elif echo "$CHANGED" | grep -qE '^test/integration/'; then
              echo "integration-needed=true" >> "$GITHUB_OUTPUT"
              echo "Integration test files changed — integration tests enabled"
            else
              echo "integration-needed=false" >> "$GITHUB_OUTPUT"
              echo "PR without integration label — skipping integration tests"
            fi
          else
            if echo "$CHANGED" | grep -qE '^(src/|test/|scripts/)'; then
              echo "integration-needed=true" >> "$GITHUB_OUTPUT"
              echo "Source changes detected — integration tests needed"
            else
              echo "integration-needed=false" >> "$GITHUB_OUTPUT"
              echo "No source changes — skipping integration tests"
            fi
          fi

          echo "Changed files:"
          echo "$CHANGED"

  lint:
    if: github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'run-integration')
    uses: "anthony-spruyt/repo-operator/.github/workflows/_lint.yaml@main"
    secrets: "inherit"

  build:
    needs:
      - "lint"
      - "check-changes"
    if: ${{ !failure() && !cancelled() && needs.check-changes.outputs.build-needed == 'true' }}
    runs-on: ubuntu-latest

    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          retention-days: 1

      - name: Create package for action tests
        run: npm pack

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package
          path: "*.tgz"
          retention-days: 1

  integration-tests:
    needs:
      - "build"
      - "check-changes"
    if: ${{ !failure() && !cancelled() && needs.check-changes.outputs.integration-needed == 'true' }}
    uses: ./.github/workflows/_integration-tests.yaml
    secrets: "inherit"

  # Summary job for branch protection - references reusable workflow job
  summary:
    needs:
      - "check-changes"
      - "lint"
      - "build"
      - "integration-tests"
    if: "always()"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_summary.yaml@main"
