---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Integration Tests

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment holding every lane's test credentials, GitHub, ADO and GitLab (integration for PRs, integration-main for main)"
        type: string
        required: true
    secrets:
      AZURE_DEVOPS_EXT_PAT:
        required: false
      GITLAB_TOKEN:
        required: false
      GH_PAT_BOT:
        required: false
      GH_PAT_ORG:
        required: false
      OPENROUTER_API_KEY:
        required: false
      TEST_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read

# Per-ref: a run waiting for approval holds its group, so a shared group would let one PR stall main
concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GitHub lanes have no needs between them: one approval releases only the jobs waiting at that moment
jobs:
  integration-test-cli-sync-ado-pat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
      deployment: false

    concurrency:
      group: integration-ado
      cancel-in-progress: false

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check environment secrets
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AZURE_DEVOPS_EXT_PAT: ${{ secrets.AZURE_DEVOPS_EXT_PAT }}
        run: .github/scripts/require-env-secrets.sh "${ENVIRONMENT}" AZURE_DEVOPS_EXT_PAT

      - uses: ./.github/actions/integration-test-setup

      - name: Install Azure CLI DevOps Extension
        run: az extension add --name azure-devops --yes

      - name: Configure git credential helper for Azure DevOps
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          chmod +x .github/scripts/git-credential-ado.sh
          git config --global credential."https://dev.azure.com".helper "$(pwd)/.github/scripts/git-credential-ado.sh"
          git config --global credential."https://dev.azure.com".useHttpPath true

      - name: Run Azure DevOps integration tests
        env:
          AZURE_DEVOPS_EXT_PAT: ${{ secrets.AZURE_DEVOPS_EXT_PAT }}
        working-directory: packages/xfg
        run: npm run test:integration:ci -- test/integration/ado.test.ts

  integration-test-cli-sync-gitlab-pat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
      deployment: false

    concurrency:
      group: integration-gitlab
      cancel-in-progress: false

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check environment secrets
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: .github/scripts/require-env-secrets.sh "${ENVIRONMENT}" GITLAB_TOKEN

      - uses: ./.github/actions/integration-test-setup

      - name: Install GitLab CLI
        run: |
          curl -sSL "https://raw.githubusercontent.com/upciti/wakemeops/main/assets/install_repository" | sudo bash
          sudo apt-get install -y glab

      - name: Configure git credential helper for GitLab
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          chmod +x .github/scripts/git-credential-gitlab.sh
          git config --global credential."https://gitlab.com".helper "$(pwd)/.github/scripts/git-credential-gitlab.sh"
          git config --global credential."https://gitlab.com".useHttpPath true

      - name: Run GitLab integration tests
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        working-directory: packages/xfg
        run: npm run test:integration:ci -- test/integration/gitlab.test.ts

  integration-test-github-sync-1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      deployment: false

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check environment secrets
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          GH_PAT_ORG: ${{ secrets.GH_PAT_ORG }}
        run: .github/scripts/require-env-secrets.sh "${ENVIRONMENT}" GH_PAT_ORG

      - name: Rate limit at start (GH_PAT_ORG)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
        run: .github/scripts/rate-limit-summary.sh start github-sync-1/GH_PAT_ORG

      - uses: ./.github/actions/integration-test-setup

      - name: Configure git
        id: git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run GitHub integration tests (PAT, shard 1/2)
        if: ${{ !cancelled() && steps.git.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
          XFG_TEST_SHARD: "1/2"
        working-directory: packages/xfg
        run: npm run test:integration:ci -- test/integration/github.test.ts

      - name: Rate limit at end (GH_PAT_ORG)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
        run: .github/scripts/rate-limit-summary.sh end github-sync-1/GH_PAT_ORG

  integration-test-github-sync-2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      deployment: false

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check environment secrets
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          GH_PAT_ORG: ${{ secrets.GH_PAT_ORG }}
        run: .github/scripts/require-env-secrets.sh "${ENVIRONMENT}" GH_PAT_ORG

      - name: Rate limit at start (GH_PAT_ORG)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
        run: .github/scripts/rate-limit-summary.sh start github-sync-2/GH_PAT_ORG

      - uses: ./.github/actions/integration-test-setup

      - name: Configure git
        id: git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run GitHub integration tests (PAT, shard 2/2)
        if: ${{ !cancelled() && steps.git.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
          XFG_TEST_SHARD: "2/2"
        working-directory: packages/xfg
        run: npm run test:integration:ci -- test/integration/github.test.ts

      - name: Rate limit at end (GH_PAT_ORG)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
        run: .github/scripts/rate-limit-summary.sh end github-sync-2/GH_PAT_ORG

  integration-test-github-app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: ${{ inputs.environment }}
      deployment: false

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check environment secrets
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          GH_PAT_ORG: ${{ secrets.GH_PAT_ORG }}
          TEST_APP_PRIVATE_KEY: ${{ secrets.TEST_APP_PRIVATE_KEY }}
        run: .github/scripts/require-env-secrets.sh "${ENVIRONMENT}" GH_PAT_ORG TEST_APP_PRIVATE_KEY

      - name: Rate limit at start (GH_PAT_ORG)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
        run: .github/scripts/rate-limit-summary.sh start github-app/GH_PAT_ORG

      - name: Mint test App token for the rate-limit summary
        id: app_rate_limit_token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.TEST_CLIENT_ID }}
          private-key: ${{ secrets.TEST_APP_PRIVATE_KEY }}
          owner: spruyt-labs
          permission-metadata: read

      - name: Rate limit at start (test App)
        if: ${{ steps.app_rate_limit_token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app_rate_limit_token.outputs.token }}
        run: .github/scripts/rate-limit-summary.sh start github-app/test-app

      - uses: ./.github/actions/integration-test-setup

      - name: Configure git
        id: git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # GH_TOKEN needed for createRepo()/deleteRepo() in tests (spruyt-labs org access).
      # xfg commands strip GH_TOKEN via xfgEnv — only App credentials are used.
      - name: Run GitHub App integration tests
        if: ${{ !cancelled() && steps.git.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
          XFG_GITHUB_CLIENT_ID: ${{ vars.TEST_CLIENT_ID }}
          XFG_GITHUB_APP_PRIVATE_KEY: ${{ secrets.TEST_APP_PRIVATE_KEY }}
        working-directory: packages/xfg
        run: npm run test:integration:ci -- test/integration/github-app.test.ts

      - name: Run GitHub secrets integration tests (PAT)
        if: ${{ !cancelled() && steps.git.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
        working-directory: packages/xfg
        run: npm run test:integration:ci -- test/integration/github-secrets.test.ts

      - name: Run GitHub variables integration tests (PAT)
        if: ${{ !cancelled() && steps.git.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
        working-directory: packages/xfg
        run: npm run test:integration:ci -- test/integration/github-variables.test.ts

      - name: Rate limit at end (GH_PAT_ORG)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
        run: .github/scripts/rate-limit-summary.sh end github-app/GH_PAT_ORG

      - name: Rate limit at end (test App)
        if: ${{ always() && steps.app_rate_limit_token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app_rate_limit_token.outputs.token }}
        run: .github/scripts/rate-limit-summary.sh end github-app/test-app

  integration-test-github-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: ${{ inputs.environment }}
      deployment: false

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check environment secrets
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          GH_PAT_ORG: ${{ secrets.GH_PAT_ORG }}
          GH_PAT_BOT: ${{ secrets.GH_PAT_BOT }}
          AZURE_DEVOPS_EXT_PAT: ${{ secrets.AZURE_DEVOPS_EXT_PAT }}
        run: .github/scripts/require-env-secrets.sh "${ENVIRONMENT}" GH_PAT_ORG GH_PAT_BOT AZURE_DEVOPS_EXT_PAT

      - name: Rate limit at start (GH_PAT_ORG)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
        run: .github/scripts/rate-limit-summary.sh start github-lifecycle/GH_PAT_ORG

      - uses: ./.github/actions/integration-test-setup

      - name: Configure git
        id: git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          chmod +x .github/scripts/git-credential-ado.sh
          git config --global credential."https://dev.azure.com".helper "$(pwd)/.github/scripts/git-credential-ado.sh"
          git config --global credential."https://dev.azure.com".useHttpPath true

      - name: Run lifecycle integration tests (PAT)
        if: ${{ !cancelled() && steps.git.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
          AZURE_DEVOPS_EXT_PAT: ${{ secrets.AZURE_DEVOPS_EXT_PAT }}
        working-directory: packages/xfg
        run: npm run test:integration:ci -- test/integration/github-lifecycle.test.ts

      - name: Run GitHub code scanning integration tests (PAT)
        if: ${{ !cancelled() && steps.git.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
        working-directory: packages/xfg
        run: npm run test:integration:ci -- test/integration/github-code-scanning.test.ts

      - name: Run GitHub collaborators integration tests (PAT)
        if: ${{ !cancelled() && steps.git.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
          GH_PAT_BOT: ${{ secrets.GH_PAT_BOT }}
        working-directory: packages/xfg
        run: npm run test:integration:ci -- test/integration/github-collaborators.test.ts

      - name: Rate limit at end (GH_PAT_ORG)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
        run: .github/scripts/rate-limit-summary.sh end github-lifecycle/GH_PAT_ORG

  integration-test-github-lifecycle-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      deployment: false

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check environment secrets
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          GH_PAT_ORG: ${{ secrets.GH_PAT_ORG }}
          TEST_APP_PRIVATE_KEY: ${{ secrets.TEST_APP_PRIVATE_KEY }}
          AZURE_DEVOPS_EXT_PAT: ${{ secrets.AZURE_DEVOPS_EXT_PAT }}
        run: .github/scripts/require-env-secrets.sh "${ENVIRONMENT}" GH_PAT_ORG TEST_APP_PRIVATE_KEY AZURE_DEVOPS_EXT_PAT

      - name: Rate limit at start (GH_PAT_ORG)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
        run: .github/scripts/rate-limit-summary.sh start github-lifecycle-app/GH_PAT_ORG

      - name: Mint test App token for the rate-limit summary
        id: app_rate_limit_token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.TEST_CLIENT_ID }}
          private-key: ${{ secrets.TEST_APP_PRIVATE_KEY }}
          owner: spruyt-labs
          permission-metadata: read

      - name: Rate limit at start (test App)
        if: ${{ steps.app_rate_limit_token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app_rate_limit_token.outputs.token }}
        run: .github/scripts/rate-limit-summary.sh start github-lifecycle-app/test-app

      - uses: ./.github/actions/integration-test-setup

      - name: Configure git
        id: git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          chmod +x .github/scripts/git-credential-ado.sh
          git config --global credential."https://dev.azure.com".helper "$(pwd)/.github/scripts/git-credential-ado.sh"
          git config --global credential."https://dev.azure.com".useHttpPath true

      - name: Run lifecycle integration tests (GitHub App)
        if: ${{ !cancelled() && steps.git.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
          XFG_GITHUB_CLIENT_ID: ${{ vars.TEST_CLIENT_ID }}
          XFG_GITHUB_APP_PRIVATE_KEY: ${{ secrets.TEST_APP_PRIVATE_KEY }}
          AZURE_DEVOPS_EXT_PAT: ${{ secrets.AZURE_DEVOPS_EXT_PAT }}
        working-directory: packages/xfg
        run: npm run test:integration:ci -- test/integration/github-lifecycle-app.test.ts

      - name: Rate limit at end (GH_PAT_ORG)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
        run: .github/scripts/rate-limit-summary.sh end github-lifecycle-app/GH_PAT_ORG

      - name: Rate limit at end (test App)
        if: ${{ always() && steps.app_rate_limit_token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app_rate_limit_token.outputs.token }}
        run: .github/scripts/rate-limit-summary.sh end github-lifecycle-app/test-app

  integration-test-github-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      deployment: false

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check environment secrets
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          GH_PAT_ORG: ${{ secrets.GH_PAT_ORG }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: .github/scripts/require-env-secrets.sh "${ENVIRONMENT}" GH_PAT_ORG OPENROUTER_API_KEY

      - name: Rate limit at start (GH_PAT_ORG)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
        run: .github/scripts/rate-limit-summary.sh start github-settings/GH_PAT_ORG

      - uses: ./.github/actions/integration-test-setup

      - name: Configure git
        id: git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run GitHub labels integration tests
        if: ${{ !cancelled() && steps.git.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
        working-directory: packages/xfg
        run: npm run test:integration:ci -- test/integration/github-labels.test.ts

      - name: Run GitHub rulesets integration tests
        if: ${{ !cancelled() && steps.git.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
        working-directory: packages/xfg
        run: npm run test:integration:ci -- test/integration/github-rulesets.test.ts

      - name: Run GitHub repo settings integration tests
        if: ${{ !cancelled() && steps.git.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
        working-directory: packages/xfg
        run: npm run test:integration:ci -- test/integration/github-repo-settings.test.ts

      - name: Run GitHub AI commit message integration tests (PAT)
        if: ${{ !cancelled() && steps.git.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        working-directory: packages/xfg
        run: npm run test:integration:ci -- test/integration/github-ai.test.ts

      - name: Rate limit at end (GH_PAT_ORG)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
        run: .github/scripts/rate-limit-summary.sh end github-settings/GH_PAT_ORG

  # Scenarios gate on their own earlier steps so one failure doesn't skip the rest
  integration-test-action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
      deployment: false

    env:
      OWNER: spruyt-labs

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check environment secrets
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          GH_PAT_ORG: ${{ secrets.GH_PAT_ORG }}
          TEST_APP_PRIVATE_KEY: ${{ secrets.TEST_APP_PRIVATE_KEY }}
        run: .github/scripts/require-env-secrets.sh "${ENVIRONMENT}" GH_PAT_ORG TEST_APP_PRIVATE_KEY

      - name: Rate limit at start (GH_PAT_ORG)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
        run: .github/scripts/rate-limit-summary.sh start action/GH_PAT_ORG

      - name: Mint test App token for the rate-limit summary
        id: app_rate_limit_token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.TEST_CLIENT_ID }}
          private-key: ${{ secrets.TEST_APP_PRIVATE_KEY }}
          owner: spruyt-labs
          permission-metadata: read

      - name: Rate limit at start (test App)
        if: ${{ steps.app_rate_limit_token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app_rate_limit_token.outputs.token }}
        run: .github/scripts/rate-limit-summary.sh start action/test-app

      - uses: ./.github/actions/integration-test-setup
        id: setup
        with:
          download-package: "true"

      - name: Arrange (sync, App) — create ephemeral repo and config
        id: sync_app_repo
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
        run: >-
          .github/scripts/create-ephemeral-repo-config.sh
          --fixture "action-app" "${OWNER}"
          "${RUNNER_TEMP}/sync-app-config.yaml"
          "packages/xfg/test/fixtures/integration-test-action-github-app.yaml"

      - name: Arrange (sync, App) — seed manifest
        id: sync_app_seed
        if: ${{ !cancelled() && steps.sync_app_repo.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
          REPO_NAME: ${{ steps.sync_app_repo.outputs.repo_name }}
        run: .github/scripts/seed-manifest.sh "${OWNER}/${REPO_NAME}" "integration-test-action-github-app"

      # github-token is set too, as in real usage, to prove App credentials take precedence
      - name: Act (sync, App) — run xfg action with GitHub App credentials
        id: sync_app_act
        if: ${{ !cancelled() && steps.sync_app_seed.outcome == 'success' }}
        uses: ./
        with:
          config: ${{ runner.temp }}/sync-app-config.yaml
          branch: chore/sync-app-test
          github-token: ${{ github.token }}
          github-client-id: ${{ vars.TEST_CLIENT_ID }}
          github-app-private-key: ${{ secrets.TEST_APP_PRIVATE_KEY }}
          xfg-package: "./${{ env.XFG_PACKAGE }}"

      - name: Assert (sync, App) — commit author is the GitHub App
        id: sync_app_assert
        if: ${{ !cancelled() && steps.sync_app_act.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
          REPO: ${{ env.OWNER }}/${{ steps.sync_app_repo.outputs.repo_name }}
        run: |
          echo "Verifying PR was created..."
          PR_INFO=$(.github/scripts/wait-for-pr.sh "${REPO}" "chore/sync-app-test")
          echo "PR created successfully:"
          echo "$PR_INFO" | jq .

          PR_NUMBER=$(echo "$PR_INFO" | jq -r '.number')
          COMMIT_SHA=$(gh pr view "$PR_NUMBER" --repo "${REPO}" --json commits --jq '.commits[-1].oid')
          COMMIT_AUTHOR=$(gh api "repos/${REPO}/commits/${COMMIT_SHA}" --jq '.commit.author.name')
          echo "Commit author: $COMMIT_AUTHOR"

          # github-actions[bot] means the App token was not used for GraphQL commits (issue #268)
          if [ "$COMMIT_AUTHOR" = "github-actions[bot]" ]; then
            echo "ERROR: Commit author is github-actions[bot] but should be the GitHub App"
            exit 1
          fi
          echo "Commit author is correct (GitHub App)"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Assert (sync, App) — file count in commit message
        if: ${{ !cancelled() && steps.sync_app_assert.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
          REPO: ${{ env.OWNER }}/${{ steps.sync_app_repo.outputs.repo_name }}
          COMMIT_SHA: ${{ steps.sync_app_assert.outputs.commit_sha }}
        run: .github/scripts/verify-commit-file-count.sh "${REPO}" "${COMMIT_SHA}"

      - name: Cleanup (sync, App) — delete ephemeral repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
          REPO_NAME: ${{ steps.sync_app_repo.outputs.repo_name }}
        run: .github/scripts/delete-ephemeral-repo.sh "${REPO_NAME:+${OWNER}/${REPO_NAME}}"

      - name: Arrange (settings) — create ephemeral repo and config
        id: settings_repo
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
        run: >-
          .github/scripts/create-ephemeral-repo-config.sh
          --fixture "action-settings" "${OWNER}"
          "${RUNNER_TEMP}/settings-config.yaml"
          "packages/xfg/test/fixtures/integration-test-action-settings-app.yaml"

      - name: Act (settings) — run xfg action
        id: settings_act
        if: ${{ !cancelled() && steps.settings_repo.outcome == 'success' }}
        uses: ./
        with:
          config: ${{ runner.temp }}/settings-config.yaml
          github-token: ${{ secrets.GH_PAT_ORG }}
          xfg-package: "./${{ env.XFG_PACKAGE }}"

      - name: Assert (settings) — ruleset was created
        if: ${{ !cancelled() && steps.settings_act.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
          REPO: ${{ env.OWNER }}/${{ steps.settings_repo.outputs.repo_name }}
        run: |
          RULESET=$(gh api "repos/${REPO}/rulesets" --jq '.[] | select(.name == "xfg-test-ruleset")')
          if [ -z "$RULESET" ]; then
            echo "ERROR: Ruleset was not created"
            exit 1
          fi
          echo "Ruleset created successfully"

      - name: Cleanup (settings) — delete ephemeral repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
          REPO_NAME: ${{ steps.settings_repo.outputs.repo_name }}
        run: .github/scripts/delete-ephemeral-repo.sh "${REPO_NAME:+${OWNER}/${REPO_NAME}}"

      - name: Arrange (secrets, App) — create ephemeral repo and config
        id: secrets_repo
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
        run: >-
          .github/scripts/create-ephemeral-repo-config.sh
          --fixture "action-secrets" "${OWNER}"
          "${RUNNER_TEMP}/secrets-config.yaml"
          "packages/xfg/test/fixtures/integration-test-action-secrets-app.yaml"

      # github.token cannot write secrets to another repo, so success proves the App token was used
      - name: Act (secrets, App) — run xfg action secrets-sync
        id: secrets_act
        if: ${{ !cancelled() && steps.secrets_repo.outcome == 'success' }}
        uses: ./
        env:
          XFG_TEST_SECRET_VALUE: integration-test-secret
        with:
          command: secrets-sync
          config: ${{ runner.temp }}/secrets-config.yaml
          github-token: ${{ github.token }}
          github-client-id: ${{ vars.TEST_CLIENT_ID }}
          github-app-private-key: ${{ secrets.TEST_APP_PRIVATE_KEY }}
          xfg-package: "./${{ env.XFG_PACKAGE }}"

      - name: Assert (secrets, App) — secret was created
        if: ${{ !cancelled() && steps.secrets_act.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
          REPO: ${{ env.OWNER }}/${{ steps.secrets_repo.outputs.repo_name }}
        run: .github/scripts/wait-for-secret.sh "${REPO}" "XFG_ACTION_APP_SECRET"

      - name: Cleanup (secrets, App) — delete ephemeral repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
          REPO_NAME: ${{ steps.secrets_repo.outputs.repo_name }}
        run: .github/scripts/delete-ephemeral-repo.sh "${REPO_NAME:+${OWNER}/${REPO_NAME}}"

      - name: Arrange (lifecycle, App) — generate unique repo name and config
        id: lifecycle_app_repo
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: >-
          .github/scripts/create-ephemeral-repo-config.sh
          "action-app" "${OWNER}"
          "${RUNNER_TEMP}/lifecycle-action-app-config.yaml"
          "lifecycle-action-app-test"
          "lifecycle-action-test.json"
          '{"createdByAction": true}'

      - name: Act (lifecycle, App) — run xfg action to create the repo
        id: lifecycle_app_act
        if: ${{ !cancelled() && steps.lifecycle_app_repo.outcome == 'success' }}
        uses: ./
        with:
          config: ${{ runner.temp }}/lifecycle-action-app-config.yaml
          merge: direct
          github-token: ${{ github.token }}
          github-client-id: ${{ vars.TEST_CLIENT_ID }}
          github-app-private-key: ${{ secrets.TEST_APP_PRIVATE_KEY }}
          xfg-package: "./${{ env.XFG_PACKAGE }}"

      - name: Assert (lifecycle, App) — repo was created
        if: ${{ !cancelled() && steps.lifecycle_app_act.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
          REPO_NAME: ${{ steps.lifecycle_app_repo.outputs.repo_name }}
        run: >-
          .github/scripts/assert-ephemeral-repo.sh
          "${OWNER}/${REPO_NAME}"
          "lifecycle-action-test.json"
          '.createdByAction == true'

      - name: Cleanup (lifecycle, App) — delete ephemeral repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
          REPO_NAME: ${{ steps.lifecycle_app_repo.outputs.repo_name }}
        run: .github/scripts/delete-ephemeral-repo.sh "${REPO_NAME:+${OWNER}/${REPO_NAME}}"

      - name: Arrange (lifecycle, PAT) — generate unique repo name and config
        id: lifecycle_pat_repo
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: >-
          .github/scripts/create-ephemeral-repo-config.sh
          "action-pat" "${OWNER}"
          "${RUNNER_TEMP}/lifecycle-action-pat-config.yaml"
          "lifecycle-action-pat-test"
          "lifecycle-action-test.json"
          '{"createdByAction": true}'

      - name: Act (lifecycle, PAT) — run xfg action to create the repo
        id: lifecycle_pat_act
        if: ${{ !cancelled() && steps.lifecycle_pat_repo.outcome == 'success' }}
        uses: ./
        with:
          config: ${{ runner.temp }}/lifecycle-action-pat-config.yaml
          merge: direct
          github-token: ${{ secrets.GH_PAT_ORG }}
          xfg-package: "./${{ env.XFG_PACKAGE }}"

      - name: Assert (lifecycle, PAT) — repo was created
        if: ${{ !cancelled() && steps.lifecycle_pat_act.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
          REPO_NAME: ${{ steps.lifecycle_pat_repo.outputs.repo_name }}
        run: >-
          .github/scripts/assert-ephemeral-repo.sh
          "${OWNER}/${REPO_NAME}"
          "lifecycle-action-test.json"
          '.createdByAction == true'

      - name: Cleanup (lifecycle, PAT) — delete ephemeral repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
          REPO_NAME: ${{ steps.lifecycle_pat_repo.outputs.repo_name }}
        run: .github/scripts/delete-ephemeral-repo.sh "${REPO_NAME:+${OWNER}/${REPO_NAME}}"

      # Last: its custom global git identity must not leak into the scenarios above
      - name: Arrange (sync, PAT) — create ephemeral repo and config
        id: sync_pat_repo
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
        run: >-
          .github/scripts/create-ephemeral-repo-config.sh
          --fixture "action-pat" "${OWNER}"
          "${RUNNER_TEMP}/sync-pat-config.yaml"
          "packages/xfg/test/fixtures/integration-test-action-github-pat.yaml"

      - name: Arrange (sync, PAT) — seed manifest and custom git identity
        id: sync_pat_seed
        if: ${{ !cancelled() && steps.sync_pat_repo.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
          REPO_NAME: ${{ steps.sync_pat_repo.outputs.repo_name }}
        run: |
          .github/scripts/seed-manifest.sh "${OWNER}/${REPO_NAME}" "integration-test-action-github-pat"
          git config --global user.name "test-user"
          git config --global user.email "test@example.com"

      - name: Act (sync, PAT) — run xfg action
        id: sync_pat_act
        if: ${{ !cancelled() && steps.sync_pat_seed.outcome == 'success' }}
        uses: ./
        with:
          config: ${{ runner.temp }}/sync-pat-config.yaml
          branch: chore/sync-my-config
          github-token: ${{ secrets.GH_PAT_ORG }}
          xfg-package: "./${{ env.XFG_PACKAGE }}"

      - name: Assert (sync, PAT) — PR created and git identity preserved
        id: sync_pat_assert
        if: ${{ !cancelled() && steps.sync_pat_act.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
          REPO: ${{ env.OWNER }}/${{ steps.sync_pat_repo.outputs.repo_name }}
        run: |
          echo "Verifying PR was created..."
          PR_INFO=$(.github/scripts/wait-for-pr.sh "${REPO}" "chore/sync-my-config")
          echo "PR created successfully:"
          echo "$PR_INFO" | jq .

          PR_NUMBER=$(echo "$PR_INFO" | jq -r '.number')
          COMMIT_SHA=$(gh pr view "$PR_NUMBER" --repo "${REPO}" --json commits --jq '.commits[-1].oid')
          COMMIT_AUTHOR=$(gh pr view "$PR_NUMBER" --repo "${REPO}" --json commits --jq '.commits[-1].authors[0].name')
          echo "Commit author: $COMMIT_AUTHOR"
          if [ "$COMMIT_AUTHOR" = "github-actions[bot]" ]; then
            echo "ERROR: Git identity was overwritten to github-actions[bot]"
            exit 1
          fi
          echo "Git identity preserved correctly"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Assert (sync, PAT) — file count in commit message
        if: ${{ !cancelled() && steps.sync_pat_assert.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
          REPO: ${{ env.OWNER }}/${{ steps.sync_pat_repo.outputs.repo_name }}
          COMMIT_SHA: ${{ steps.sync_pat_assert.outputs.commit_sha }}
        run: .github/scripts/verify-commit-file-count.sh "${REPO}" "${COMMIT_SHA}"

      - name: Cleanup (sync, PAT) — delete ephemeral repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
          REPO_NAME: ${{ steps.sync_pat_repo.outputs.repo_name }}
        run: .github/scripts/delete-ephemeral-repo.sh "${REPO_NAME:+${OWNER}/${REPO_NAME}}"

      - name: Rate limit at end (GH_PAT_ORG)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ORG }}
        run: .github/scripts/rate-limit-summary.sh end action/GH_PAT_ORG

      - name: Rate limit at end (test App)
        if: ${{ always() && steps.app_rate_limit_token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app_rate_limit_token.outputs.token }}
        run: .github/scripts/rate-limit-summary.sh end action/test-app
