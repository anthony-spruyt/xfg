---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Deploy Docs

on:
  push:
    branches:
      - "main"
    paths:
      - "docs/**"
      - "!docs/superpowers/**"
      - "mkdocs.yml"
    tags:
      # Floating `vN` tags only. release.yaml moves `vN` *after* pushing the
      # three-part tag, so a `v*.*.*` trigger checks out before `vN` has moved
      # and builds the previous release's docs.
      - "v[0-9]+"
  pull_request:
    branches:
      - "main"
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"

      - name: Install docs toolchain
        run: pip install --require-hashes -r docs/requirements.txt

      - name: Build docs
        if: github.event_name == 'pull_request'
        run: mkdocs build --strict

      - name: Configure git for mike
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "xfg-release[bot]"
          git config user.email "xfg-release[bot]@users.noreply.github.com"

      - name: Deploy released major as latest
        if: ${{ github.event_name != 'pull_request' && github.ref_type == 'tag' }}
        # `--alias-type copy` is load-bearing: Pages does not follow symlinks,
        # so a symlinked `latest` alias 404s.
        run: |
          major="${GITHUB_REF_NAME#v}"
          mike deploy --update-aliases --alias-type copy "${major}.x" latest
          mike set-default latest

      - name: Deploy unreleased main as next
        if: ${{ github.event_name != 'pull_request' && github.ref_type != 'tag' }}
        run: mike deploy next

      - name: Bundle gh-pages
        if: github.event_name != 'pull_request'
        run: git bundle create "${RUNNER_TEMP}/gh-pages.bundle" gh-pages

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gh-pages
          path: ${{ runner.temp }}/gh-pages.bundle
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: gh-pages
          path: ${{ runner.temp }}/site

      - name: Restore gh-pages
        run: git fetch --no-tags "${RUNNER_TEMP}/site/gh-pages.bundle" "gh-pages:refs/heads/gh-pages"

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Push gh-pages
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git push origin refs/heads/gh-pages:refs/heads/gh-pages
