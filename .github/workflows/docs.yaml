---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Deploy Docs

on:
  push:
    branches:
      - "main"
    paths:
      - "docs/**"
      - "!docs/superpowers/**"
      - "mkdocs.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.x"

      - name: Install MkDocs Material
        run: pip install 'mkdocs<2' 'mkdocs-material<9.7' mike

      - name: Configure git for mike
        run: |
          git config user.name "xfg-release[bot]"
          git config user.email "xfg-release[bot]@users.noreply.github.com"

      - name: Build v3 docs from tag
        run: |
          # Check out v3 docs sources into a temp directory
          git worktree add /tmp/v3-docs v3
          # Build v3 docs using v3's mkdocs.yml
          mike deploy --config-file /tmp/v3-docs/mkdocs.yml 3.x
          git worktree remove /tmp/v3-docs

      - name: Build v4 docs from tag
        run: |
          git worktree add /tmp/v4-docs v4.0.5
          mike deploy --config-file /tmp/v4-docs/mkdocs.yml 4.x
          git worktree remove /tmp/v4-docs

      - name: Build v5 docs from main
        run: mike deploy --update-aliases --alias-type copy 5.x latest

      - name: Set default version
        run: mike set-default latest

      - name: Extract site for deployment
        run: |
          # Check out the built site from local gh-pages branch
          git worktree add /tmp/site gh-pages
          # Remove .git artifacts from the deployment directory
          rm -rf /tmp/site/.git

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: /tmp/site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Save mike state to gh-pages branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TREE_SHA=$(git rev-parse "gh-pages^{tree}")
          MESSAGE=$(git log -1 --format=%s gh-pages)

          # Push local gh-pages objects to a temporary tag ref so GitHub
          # has the tree/blob objects. Tags are not covered by the
          # branch-signatures ruleset (refs/heads/**).
          git push --force origin "gh-pages:refs/tags/_gh-pages-staging"

          # Get parent commit SHA (empty string if gh-pages doesn't exist on remote)
          PARENT_SHA=""
          if gh api "repos/${{ github.repository }}/git/ref/heads/gh-pages" --jq '.object.sha' > /tmp/parent_sha 2>/dev/null; then
            PARENT_SHA=$(cat /tmp/parent_sha)
          fi

          # Create a signed commit via the GitHub API
          if [ -n "$PARENT_SHA" ]; then
            COMMIT_SHA=$(gh api "repos/${{ github.repository }}/git/commits" \
              --method POST \
              -f "message=$MESSAGE" \
              -f "tree=$TREE_SHA" \
              -f "parents[]=$PARENT_SHA" \
              --jq '.sha')

            gh api "repos/${{ github.repository }}/git/refs/heads/gh-pages" \
              --method PATCH \
              -f "sha=$COMMIT_SHA" \
              -F "force=true"
          else
            COMMIT_SHA=$(gh api "repos/${{ github.repository }}/git/commits" \
              --method POST \
              -f "message=$MESSAGE" \
              -f "tree=$TREE_SHA" \
              --jq '.sha')

            gh api "repos/${{ github.repository }}/git/refs" \
              --method POST \
              -f "ref=refs/heads/gh-pages" \
              -f "sha=$COMMIT_SHA"
          fi

          echo "Saved mike state as verified commit $COMMIT_SHA to gh-pages"

      - name: Clean up staging tag
        if: always()
        run: git push origin --delete refs/tags/_gh-pages-staging || true

      - name: Clean up worktree
        if: always()
        run: git worktree remove /tmp/site || true
