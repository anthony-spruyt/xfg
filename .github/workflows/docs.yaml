---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Deploy Docs

on:
  push:
    branches:
      - "main"
    paths:
      - "docs/**"
      - "!docs/superpowers/**"
      - "mkdocs.yml"
    tags:
      # Floating `vN` tags only. release.yaml moves `vN` *after* pushing the
      # three-part tag, so a `v*.*.*` trigger checks out before `vN` has moved
      # and builds the previous release's docs.
      - "v[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d
        with:
          egress-policy: audit

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"

      - name: Install docs toolchain
        run: pip install -r docs/requirements.txt

      - name: Configure git for mike
        run: |
          git config user.name "xfg-release[bot]"
          git config user.email "xfg-release[bot]@users.noreply.github.com"

      - name: Deploy released major as latest
        if: ${{ github.ref_type == 'tag' }}
        # `--alias-type copy` is load-bearing: Pages does not follow symlinks,
        # so a symlinked `latest` alias 404s.
        run: |
          major="${GITHUB_REF_NAME#v}"
          mike deploy --push --update-aliases --alias-type copy "${major}.x" latest
          mike set-default --push latest

      - name: Deploy unreleased main as next
        if: ${{ github.ref_type != 'tag' }}
        run: mike deploy --push next
