---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
# Do not rename this file — npm Trusted Publishing authenticates by matching
# the workflow filename, and that setting cannot be edited in place. A rename
# fails the publish with ENEEDAUTH after the tag has already been cut.
name: Release Please

on:
  push:
    branches:
      - main
    tags:
      # Three-part only, so the floating `vN` tag this workflow pushes does not
      # re-enter it. Matching `v*` would make every release publish twice.
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release please
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d
        with:
          egress-policy: audit

      # GITHUB_TOKEN cannot open pull requests here, and its pull requests would
      # not trigger the status checks that pr-rules requires. The app also holds
      # the tag-rules bypass needed to create tags.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish
    # Keyed off the tag, not off release-please's output. The tag is the state:
    # it either exists or it does not, so re-running this job against an already
    # -tagged release is the ordinary retry path rather than a special mode.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      TAG_NAME: ${{ github.ref_name }}
    defaults:
      run:
        working-directory: packages/xfg
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d
        with:
          egress-policy: audit

      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: packages/xfg/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Update floating major version tag
        # docs.yaml triggers on this `v{N}` tag to publish versioned docs, and
        # consumers pin `anthony-spruyt/xfg@v6` — dropping this breaks both.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          MAJOR=$(echo "${TAG_NAME#v}" | cut -d. -f1)
          COMMIT_SHA=$(gh api "repos/$REPO/git/ref/tags/${TAG_NAME}" --jq '.object.sha')

          # Use git/ref (singular) for exact match — git/refs (plural) does prefix matching.
          # On 404 gh prints the error body to stdout, so reset CURRENT rather than `|| true`
          # or the first release of a new major PATCHes a non-existent ref and 422s.
          CURRENT=$(gh api "repos/$REPO/git/ref/tags/v${MAJOR}" --jq '.object.sha' 2>/dev/null) || CURRENT=""

          if [ "$CURRENT" = "$COMMIT_SHA" ]; then
            echo "v${MAJOR} already at ${COMMIT_SHA}"
          elif [ -n "$CURRENT" ]; then
            # Force-update in one call rather than delete-then-create: tag-rules
            # blocks deletion, so a failed recreate would leave v${MAJOR} missing.
            gh api --method PATCH "repos/$REPO/git/refs/tags/v${MAJOR}" \
              -f sha="$COMMIT_SHA" \
              -F force=true
            echo "Updated v${MAJOR} tag to ${COMMIT_SHA}"
          else
            gh api "repos/$REPO/git/refs" \
              -f ref="refs/tags/v${MAJOR}" \
              -f sha="$COMMIT_SHA"
            echo "Created v${MAJOR} tag at ${COMMIT_SHA}"
          fi

      - name: Check whether this version is already on npm
        id: npm-check
        # Re-running against an existing tag must not fail on the second publish
        # attempt; npm rejects a duplicate version with E403.
        run: |
          VERSION="${TAG_NAME#v}"
          if npm view "@aspruyt/xfg@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@aspruyt/xfg@${VERSION} is already on npm"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: ${{ steps.npm-check.outputs.published == 'false' }}
        run: npm publish --provenance --access public

      # Last, so a failed npm publish leaves the release a draft rather than
      # announcing a version that has no package behind it.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: gh release edit "$TAG_NAME" --repo "$REPO" --draft=false
