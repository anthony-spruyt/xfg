---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      ci_timeout:
        description: "Seconds to wait for CI after version bump"
        required: false
        type: number
        default: 1200

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Bump version locally
        id: version
        run: |
          npm version ${{ inputs.version }} --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build
        run: npm run build

      - name: Create verified commit
        id: commit
        uses: iarekylew00t/verified-bot-commit@5b4e8852dc472093935b8debcb81459bb79f7986 # v2
        with:
          token: ${{ steps.app-token.outputs.token }}
          message: "chore: release v${{ steps.version.outputs.version }}"
          files: |
            package.json
            package-lock.json

      - name: Wait for CI to pass
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit }}
        run: |
          echo "Waiting for CI on commit $COMMIT_SHA..."

          TIMEOUT=${{ inputs.ci_timeout }}
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            # Get all check runs for this commit
            CHECK_RUNS=$(gh api "repos/$REPO/commits/$COMMIT_SHA/check-runs" --jq '.check_runs')

            # Count total, completed, successful/skipped, and failed
            TOTAL=$(echo "$CHECK_RUNS" | jq 'length')
            COMPLETED=$(echo "$CHECK_RUNS" | jq '[.[] | select(.status == "completed")] | length')
            SUCCESSFUL=$(echo "$CHECK_RUNS" | jq '[.[] | select(.status == "completed" and (.conclusion == "success" or .conclusion == "skipped" or .conclusion == "neutral"))] | length')
            FAILED=$(echo "$CHECK_RUNS" | jq '[.[] | select(.status == "completed" and (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out"))] | length')

            echo "Check runs: $COMPLETED/$TOTAL completed, $SUCCESSFUL successful, $FAILED failed ($ELAPSED seconds)"

            # If any check failed, exit immediately
            if [ "$FAILED" -gt 0 ]; then
              echo "CI failed - check runs with failures:"
              echo "$CHECK_RUNS" | jq -r '.[] | select(.status == "completed" and (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")) | "  - \(.name): \(.conclusion)"'
              exit 1
            fi

            # If all checks completed successfully, we're done
            if [ "$TOTAL" -gt 0 ] && [ "$COMPLETED" -eq "$TOTAL" ]; then
              echo "All $TOTAL check runs passed"
              exit 0
            fi

            # Show pending checks
            echo "Pending checks:"
            echo "$CHECK_RUNS" | jq -r '.[] | select(.status != "completed") | "  - \(.name): \(.status)"'

            sleep 15
            ELAPSED=$((ELAPSED + 15))
          done

          echo "Timeout waiting for CI"
          exit 1

      - name: Create lightweight tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit }}
          REPO: ${{ github.repository }}
        run: |
          echo "Verified commit: $COMMIT_SHA"

          gh api "repos/$REPO/git/refs" \
            -f ref="refs/tags/v${VERSION}" \
            -f sha="$COMMIT_SHA"
          echo "Created tag v${VERSION}"

      - name: Update floating major version tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit }}
          REPO: ${{ github.repository }}
        run: |
          MAJOR=$(echo "${VERSION}" | cut -d. -f1)

          # Delete and recreate the major version tag (e.g., v3)
          # Use git/ref (singular) for exact match — git/refs (plural) does prefix matching
          if gh api "repos/$REPO/git/ref/tags/v${MAJOR}" &>/dev/null; then
            gh api --method DELETE "repos/$REPO/git/refs/tags/v${MAJOR}"
            echo "Deleted existing v${MAJOR} tag"
          fi
          gh api "repos/$REPO/git/refs" \
            -f ref="refs/tags/v${MAJOR}" \
            -f sha="$COMMIT_SHA"
          echo "Updated v${MAJOR} tag to ${COMMIT_SHA}"

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          token: ${{ steps.app-token.outputs.token }}
