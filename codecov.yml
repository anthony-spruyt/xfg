coverage:
  status:
    project:
      default:
        target: 95%
        threshold: 1%
        base: auto
    patch:
      default:
        target: 95%
        threshold: 1%

ignore:
  # Entry point (just calls parse)
  - "packages/xfg/src/cli.ts"

  # Re-export only
  - "packages/xfg/src/index.ts"

  # CLI configuration (declarative, tested via integration)
  - "packages/xfg/src/cli/program.ts"

  # Type-only files (no executable code)
  - "packages/xfg/src/cli/types.ts"
  - "packages/xfg/src/config/types.ts"
  - "packages/xfg/src/lifecycle/types.ts"
  - "packages/xfg/src/output/types.ts"
  - "packages/xfg/src/sync/types.ts"
  - "packages/xfg/src/vcs/types.ts"
  - "packages/xfg/src/settings/rulesets/types.ts"
  - "packages/xfg/src/settings/repo-settings/types.ts"
  - "packages/xfg/src/settings/code-scanning/types.ts"
  - "packages/xfg/src/settings/labels/types.ts"
  - "packages/xfg/src/settings/variables/types.ts"
  - "packages/xfg/src/secrets/types.ts"

  # Re-export index files (no logic, just exports)
  - "packages/xfg/src/cli/index.ts"
  - "packages/xfg/src/config/index.ts"
  - "packages/xfg/src/lifecycle/index.ts"
  - "packages/xfg/src/sync/index.ts"
  - "packages/xfg/src/vcs/index.ts"
  - "packages/xfg/src/shared/index.ts"
  - "packages/xfg/src/output/index.ts"
  - "packages/xfg/src/settings/index.ts"
  - "packages/xfg/src/settings/rulesets/index.ts"
  - "packages/xfg/src/settings/repo-settings/index.ts"
  - "packages/xfg/src/settings/code-scanning/index.ts"
  - "packages/xfg/src/settings/variables/index.ts"
  - "packages/xfg/src/secrets/index.ts"

  # Test utilities
  - "packages/xfg/test/mocks/**"

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true
