# yaml-language-server: $schema=https://raw.githubusercontent.com/anthony-spruyt/xfg/main/config-schema.json
# Integration test config for xfg settings - tests label management
id: integration-test-github-labels

# Placeholder file required by schema - excluded from target repo
files:
  .xfg-labels-test:
    content: "# Placeholder for labels integration test"
    createOnly: true

settings:
  labels:
    xfg-test-bug:
      color: d73a4a
      description: "Something isn't working"
    xfg-test-feature:
      color: a2eeef
      description: "New feature or request"

repos:
  - git: https://github.com/anthony-spruyt/xfg-test-8.git
    files:
      .xfg-labels-test: false
