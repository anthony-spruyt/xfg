# yaml-language-server: $schema=https://raw.githubusercontent.com/anthony-spruyt/xfg/main/config-schema.json
# Integration test config - tests prOptions.labels attaches labels to created PRs
id: integration-test-pr-labels-github
files:
  pr-labels-test.json:
    content:
      prLabelsTest: true
      syncedByXfg: true

prOptions:
  labels:
    - bug
    - enhancement

repos:
  - git: https://github.com/anthony-spruyt/xfg-test.git
